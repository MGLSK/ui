name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, pack check, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (browser tests)
        run: npx playwright install --with-deps chromium

      - name: Build (dist, starter assets, docs pages)
        run: npm run build

      # dist/, components/ and starter/assets/ are committed build output; a stale copy would ship the wrong code.
      - name: Generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff --stat
            echo "::error::Generated files are out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Pack guard (what would be published)
        run: npm run check:pack

      - name: Tests (starter, theming, sweep, interactions, accessibility)
        run: npm test
